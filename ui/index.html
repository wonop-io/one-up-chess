<!doctype html>
<meta charset="utf-8" />
<title>Chess</title>
<style>
  html, body { height: 100%; margin: 0; background: var(--wm-content); overflow: hidden; }
  main { display: flex; flex-direction: column; height: 100vh; }
  .layout { flex: 1; min-height: 0; display: flex; }

  /* The board takes the whole window. --u is one square's share of the
     frame: eight squares plus a coordinate gutter on each side (0.55u). */
  .stage {
    flex: 1; min-width: 0; position: relative; container-type: size;
    display: grid; place-items: center;
  }
  .frame {
    --u: calc(min(100cqw, 100cqh) / 9.1);
    width: calc(var(--u) * 9.1); height: calc(var(--u) * 9.1);
    display: grid;
    grid-template-columns: calc(var(--u) * 0.55) calc(var(--u) * 8) calc(var(--u) * 0.55);
    grid-template-rows: calc(var(--u) * 0.55) calc(var(--u) * 8) calc(var(--u) * 0.55);
  }
  .top {
    grid-column: 1 / 4; grid-row: 1; min-width: 0;
    display: flex; align-items: center; gap: 0.6em; padding: 0 calc(var(--u) * 0.55);
    font-size: clamp(13px, calc(var(--u) * 0.3), 22px); white-space: nowrap; overflow: hidden;
  }
  .status { font-weight: 600; flex: none; }
  .status .dot {
    display: inline-block; width: 0.5em; height: 0.5em; border-radius: 50%;
    margin-right: 0.45em; vertical-align: 0.1em; background: var(--wm-signal-attention, #f5b83d);
  }
  .status .dot.live { background: var(--wm-signal-live, #34c759); }
  .status .dot.danger { background: var(--wm-signal-danger, #ff5f57); }
  .hint { color: var(--wm-text-dim); overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  /* Coordinates: big, bold and in the text colour, so they read from across a room. */
  .ranks, .files {
    display: grid; font-weight: 700; color: var(--wm-text); user-select: none;
    font-size: max(13px, calc(var(--u) * 0.4)); line-height: 1;
    font-family: ui-sans-serif, -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums;
  }
  .ranks { grid-row: 2; grid-template-rows: repeat(8, 1fr); }
  .ranks span, .files span { display: grid; place-items: center; }
  .ranks.left { grid-column: 1; }
  .ranks.right { grid-column: 3; }
  .files { grid-column: 2; grid-row: 3; grid-template-columns: repeat(8, 1fr); }
  .corner { grid-column: 3; grid-row: 3; display: grid; place-items: center; }
  .corner button {
    width: calc(var(--u) * 0.5); height: calc(var(--u) * 0.5); min-width: 24px; min-height: 24px;
    padding: 0; display: grid; place-items: center; border-radius: 6px;
  }
  .corner svg { width: 60%; height: 60%; }

  .board {
    grid-column: 2; grid-row: 2;
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    border-radius: 4px; overflow: hidden;
    box-shadow: 0 0 0 0.5px var(--wm-hairline), 0 8px 24px rgb(0 0 0 / 0.25);
  }
  .sq {
    all: unset; position: relative; display: grid; place-items: center;
    background: #ebe5d6; cursor: default; container-type: size;
  }
  .sq.dark { background: #a7967a; }
  .sq.last { background: color-mix(in srgb, #ebe5d6 55%, #e8c15a); }
  .sq.dark.last { background: color-mix(in srgb, #a7967a 55%, #d9a93a); }
  .sq.sel { background: color-mix(in srgb, #ebe5d6 40%, #6aa4d8); }
  .sq.dark.sel { background: color-mix(in srgb, #a7967a 40%, #4d8cc8); }
  .sq.mine, .sq.target { cursor: pointer; }
  .sq:focus-visible { outline: 3px solid #2f74c0; outline-offset: -3px; z-index: 2; }
  .sq.check::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle, rgb(255 95 87 / 0.85) 0%, rgb(255 95 87 / 0.45) 40%, transparent 72%);
  }
  .sq.target::after {
    content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%;
    background: rgb(20 20 30 / 0.28);
  }
  .sq.target.capture::after {
    width: 86%; height: 86%; background: none; box-sizing: border-box;
    border: 6cqmin solid rgb(20 20 30 / 0.28);
  }
  .sq.target:hover::after { background: rgb(20 20 30 / 0.42); }
  .sq.target.capture:hover::after { background: none; border-color: rgb(20 20 30 / 0.45); }
  .piece {
    position: relative; z-index: 1; font-size: 78cqmin; line-height: 1;
    font-family: "Apple Symbols", "Segoe UI Symbol", "DejaVu Sans", serif;
    pointer-events: none; user-select: none;
  }
  .piece.w { color: #fbfaf7; -webkit-text-stroke: 1.2cqmin #26221c; text-shadow: 0 1.5cqmin 2cqmin rgb(0 0 0 / 0.35); }
  .piece.b { color: #1f1c18; -webkit-text-stroke: 0.6cqmin #1f1c18; text-shadow: 0 1.5cqmin 2cqmin rgb(0 0 0 / 0.3); }

  /* Promotion asks over the board, so it works with the panel closed. */
  .promo {
    position: absolute; inset: 0; display: none; place-items: center;
    background: rgb(0 0 0 / 0.35); z-index: 5;
  }
  .promo.open { display: grid; }
  .promo .card {
    background: var(--wm-surface); border-radius: 12px; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 12px; box-shadow: 0 12px 40px rgb(0 0 0 / 0.4);
  }
  .promo p { margin: 0; font-size: 15px; font-weight: 600; }
  .promo .row { display: flex; gap: 8px; }
  .promo .row button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; font-size: 13px; }
  .promo .glyph { font-family: "Apple Symbols", "Segoe UI Symbol", serif; font-size: 40px; line-height: 1; }

  aside {
    width: 280px; flex: none; display: flex; flex-direction: column; gap: 12px; min-height: 0;
    padding: 14px 16px 16px; box-sizing: border-box;
    box-shadow: inset 0.5px 0 0 var(--wm-hairline);
  }
  aside[hidden] { display: none; }
  /* In a narrow window the panel floats over the board instead of shrinking it. */
  @media (max-width: 640px) {
    .layout { position: relative; }
    aside {
      position: absolute; top: 0; right: 0; bottom: 0; width: min(300px, 86vw); z-index: 4;
      background: var(--wm-surface); box-shadow: -12px 0 32px rgb(0 0 0 / 0.35);
    }
  }
  aside h2 { margin: 0; font-size: 15px; font-weight: 600; }
  aside .who { margin: -8px 0 0; font-size: 13px; color: var(--wm-text-dim); }
  .moves {
    flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0; list-style: none;
    font-size: 15px; font-variant-numeric: tabular-nums;
  }
  .moves li { display: grid; grid-template-columns: 38px 1fr 1fr; padding: 4px 8px; border-radius: 6px; }
  .moves li:nth-child(odd) { background: var(--wm-fill); }
  .moves .n { color: var(--wm-text-dim); }
  .moves .latest { font-weight: 600; }
  .empty { font-size: 13px; color: var(--wm-text-dim); }
  .confirm { display: none; flex-direction: column; gap: 8px; }
  .confirm.open { display: flex; }
  .confirm p { margin: 0; font-size: 13px; }
  .seg { display: flex; background: var(--wm-fill); border-radius: var(--wm-radius, 6px); padding: 2px; }
  .seg button { flex: 1; }
  .seg button[aria-pressed="true"] { background: var(--wm-fill-strong); }
  .actions { display: flex; gap: 6px; }
  .actions button { flex: 1; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .field input { font-size: 15px; }
  .legal { margin: 0; font-size: 13px; line-height: 19px; color: var(--wm-text-dim); max-height: 96px; overflow-y: auto; }
  .label { margin: 0; font-size: 11px; color: var(--wm-text-dim); }
  .fen { margin: 0; font: 11px ui-monospace, monospace; color: var(--wm-text-dim); user-select: all; overflow-wrap: anywhere; }
  wm-notice { flex: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
<main>
  <div class="layout">
    <div class="stage">
      <div class="frame">
        <div class="top"><span class="status" id="status"></span><span class="hint" id="hint"></span></div>
        <div class="ranks left" id="ranksL" aria-hidden="true"></div>
        <div class="board" id="board" role="grid" aria-label="Chess board"></div>
        <div class="ranks right" id="ranksR" aria-hidden="true"></div>
        <div class="files" id="files" aria-hidden="true"></div>
        <div class="corner">
          <button type="button" id="panelToggle" aria-controls="panel" aria-expanded="false" aria-label="Show panel" title="Show panel">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M10 3v10"/></svg>
          </button>
        </div>
      </div>
      <div class="promo" id="promo" role="dialog" aria-label="Promote the pawn">
        <div class="card">
          <p>Promote the pawn to</p>
          <div class="row" id="promoRow"></div>
        </div>
      </div>
    </div>
    <aside id="panel" hidden aria-label="Game panel">
      <h2>Chess</h2>
      <p class="who" id="context"></p>
      <form class="field" id="moveForm" autocomplete="off">
        <label for="moveInput">Type a move</label>
        <input id="moveInput" name="move" placeholder="e2e4 or Nf3" aria-describedby="legal" spellcheck="false" />
      </form>
      <p class="legal" id="legal" aria-live="off"></p>
      <ol class="moves" id="moves" aria-label="Moves played"></ol>
      <div class="confirm" id="confirm" role="group" aria-label="New game">
        <p>Start a new game, playing</p>
        <div class="seg" id="seg">
          <button type="button" data-side="white" aria-pressed="true">White</button>
          <button type="button" data-side="black" aria-pressed="false">Black</button>
        </div>
        <div class="actions">
          <button type="button" id="cancelNew">Cancel</button>
          <button type="button" class="primary" id="startNew">Start</button>
        </div>
      </div>
      <div class="field" role="group" aria-labelledby="seatLabel">
        <p class="label" id="seatLabel">This board plays</p>
        <div class="seg" id="seat">
          <button type="button" data-side="white" aria-pressed="true">White</button>
          <button type="button" data-side="black" aria-pressed="false">Black</button>
        </div>
      </div>
      <p class="fen" id="fen" aria-label="Position as FEN"></p>
      <div class="actions" id="mainActions">
        <button type="button" id="replayBtn">Replay game</button>
        <button type="button" id="newGame">New game</button>
        <button type="button" id="hidePanel">Hide panel</button>
      </div>
    </aside>
  </div>
  <div id="notice"></div>
  <div class="sr" aria-live="polite" id="live"></div>
</main>
<script>
  // The board is a view: main.ts holds the game, and every change arrives as
  // a "state" message. This page only picks squares and asks for a move.
  const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
  const NAME = { k: "king", q: "queen", r: "rook", b: "bishop", n: "knight", p: "pawn" };
  const FILES = "abcdefgh";
  const $ = (id) => document.getElementById(id);
  const boardEl = $("board");

  let state = null;
  let selected = null;     // square name, e.g. "e2"
  let focusSq = "e2";
  let pendingPromo = null; // { from, to }
  let newSide = "white";
  let lastAnnounced = "";
  let flash = "";          // why the last click did nothing; cleared by the next one

  // Which side this window moves: the host's unless someone picks another,
  // so a computer-use agent can play the assistant's side on its own board.
  let seat = null;
  const seatSide = () => seat ?? state?.host ?? "white";
  const seatColor = () => (seatSide() === "black" ? "b" : "w");
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  const myTurn = () => state && !replay && !state.over && state.turn === seatSide();

  // A replay shows recorded positions one at a time and then the live one
  // again. It only changes what this page draws: `state` stays the live game,
  // and nothing is sent to main.ts while it runs.
  let replay = null;       // { frames, i, delayMs, timer }
  let noteShown = false;

  function pieceAt(sq) {
    const f = FILES.indexOf(sq[0]);
    const r = Number(sq[1]) - 1;
    const ch = state.board[7 - r].split(" ")[f];
    return ch === "." ? null : ch;
  }
  const colorOf = (p) => (p === p.toUpperCase() ? "w" : "b");
  const describePiece = (p) => `${colorOf(p) === "w" ? "white" : "black"} ${NAME[p.toLowerCase()]}`;
  const movesFrom = (sq) => (state?.legalMoves || []).filter((m) => m.uci.startsWith(sq));

  // Squares in the order they are drawn: the host's side at the bottom.
  function drawOrder() {
    const out = [];
    const flip = seatColor() === "b";
    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        const r = flip ? row : 7 - row;
        const f = flip ? 7 - col : col;
        out.push(FILES[f] + (r + 1));
      }
    }
    return out;
  }

  function checkSquare() {
    if (!state.inCheck) return null;
    const king = state.turn === "white" ? "K" : "k";
    for (let r = 0; r < 8; r++) {
      const f = state.board[7 - r].split(" ").indexOf(king);
      if (f >= 0) return FILES[f] + (r + 1);
    }
    return null;
  }

  function render() {
    if (!state) return;
    if (!replay) return draw();
    const live = state;
    const f = replay.frames[replay.i];
    state = {
      ...live,
      board: f.board,
      turn: f.turn,
      inCheck: f.inCheck,
      lastMove: f.lastMove,
      moves: live.moves.slice(0, f.ply),
      legalMoves: [],
      over: false,
      toMoveIs: null,
      sentence: f.ply ? `Replay ${f.label}` : "Replay: start position",
    };
    try {
      draw();
    } finally {
      state = live;
    }
  }

  function startReplay(frames, delayMs) {
    if (replay) clearTimeout(replay.timer);
    if (!Array.isArray(frames) || !frames.length) return;
    selected = null;
    pendingPromo = null;
    flash = "";
    replay = { frames, i: 0, delayMs: delayMs || 1000, timer: null };
    showFrame();
  }

  function showFrame() {
    render();
    const f = replay.frames[replay.i];
    announce(f.ply ? `Replay ${f.label}` : "Replay from the start position");
    replay.timer = setTimeout(() => {
      if (!replay) return;
      if (replay.i + 1 >= replay.frames.length) return stopReplay(true);
      replay.i++;
      showFrame();
    }, replay.delayMs);
  }

  function stopReplay(finished) {
    if (!replay) return;
    clearTimeout(replay.timer);
    replay = null;
    render();
    announce(`${finished ? "Replay finished" : "Replay stopped"}. ${state.sentence}`);
  }

  function draw() {
    const order = drawOrder();
    const targets = selected ? movesFrom(selected) : [];
    const targetSet = new Set(targets.map((m) => m.uci.slice(2, 4)));
    const last = state.lastMove ? [state.lastMove.uci.slice(0, 2), state.lastMove.uci.slice(2, 4)] : [];
    const checked = checkSquare();
    const hadFocus = boardEl.contains(document.activeElement);
    boardEl.textContent = "";
    for (let row = 0; row < 8; row++) {
      const rowEl = document.createElement("div");
      rowEl.setAttribute("role", "row");
      rowEl.style.display = "contents";
      for (let col = 0; col < 8; col++) {
        const sq = order[row * 8 + col];
        const f = FILES.indexOf(sq[0]);
        const r = Number(sq[1]) - 1;
        const p = pieceAt(sq);
        const b = document.createElement("button");
        b.type = "button";
        b.className = "sq" + ((f + r) % 2 === 0 ? " dark" : "");
        b.dataset.sq = sq;
        b.setAttribute("role", "gridcell");
        b.tabIndex = sq === focusSq ? 0 : -1;
        if (last.includes(sq)) b.classList.add("last");
        if (sq === selected) b.classList.add("sel");
        if (sq === checked) b.classList.add("check");
        if (p && colorOf(p) === seatColor() && myTurn()) b.classList.add("mine");
        const isTarget = targetSet.has(sq);
        if (isTarget) {
          b.classList.add("target");
          if (p || targets.some((m) => m.uci.slice(2, 4) === sq && /x/.test(m.san))) b.classList.add("capture");
        }
        let label = sq + ", " + (p ? describePiece(p) : "empty");
        if (sq === selected) label += ", selected";
        if (isTarget) label += p ? ", capture" : ", legal move";
        if (sq === checked) label += ", in check";
        b.setAttribute("aria-label", label);
        if (p) {
          const s = document.createElement("span");
          s.className = "piece " + colorOf(p);
          s.textContent = GLYPH[p.toLowerCase()] + "︎";
          b.appendChild(s);
        }
        rowEl.appendChild(b);
      }
      boardEl.appendChild(rowEl);
    }
    for (const [id, pick] of [["ranksL", (i) => order[i * 8][1]], ["ranksR", (i) => order[i * 8][1]], ["files", (i) => order[56 + i][0]]]) {
      const el = $(id);
      el.textContent = "";
      for (let i = 0; i < 8; i++) {
        const c = document.createElement("span");
        c.textContent = pick(i);
        el.appendChild(c);
      }
    }
    if (hadFocus) boardEl.querySelector(`[data-sq="${focusSq}"]`)?.focus();

    $("context").textContent = `This board plays ${seatSide()}. The host is ${state.host}, the assistant ${state.assistant}.`;
    for (const b of $("seat").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.side === seatSide()));
    $("fen").textContent = state.fen;
    $("legal").textContent = state.over
      ? "No legal moves: the game is over."
      : myTurn()
        ? `Legal moves for ${cap(state.turn)}: ${state.legalMoves.map((m) => m.san).join(", ")}`
        : `${cap(state.turn)} to move. This board plays ${seatSide()}.`;
    const status = $("status");
    status.textContent = "";
    const dot = document.createElement("span");
    dot.className = "dot";
    if (state.over) dot.className = "dot live";
    else if (state.inCheck) dot.className = "dot danger";
    if (state.over || myTurn() || state.inCheck) status.appendChild(dot);
    status.appendChild(document.createTextNode(state.sentence));
    $("hint").textContent = hintText();

    const list = $("moves");
    list.textContent = "";
    if (!state.moves.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.style.display = "block";
      li.style.background = "none";
      li.textContent = myTurn() ? "Make the first move." : `${cap(state.turn)} moves first.`;
      list.appendChild(li);
    } else {
      // Number from the starting position, so a game set up from a FEN reads right.
      const startFull = Number(state.startFen.split(" ")[5] || 1);
      const blackFirst = state.startFen.split(" ")[1] === "b";
      const plies = blackFirst ? [null, ...state.moves] : state.moves.slice();
      for (let i = 0; i < plies.length; i += 2) {
        const li = document.createElement("li");
        const n = document.createElement("span");
        n.className = "n";
        n.textContent = startFull + i / 2 + ".";
        li.appendChild(n);
        for (const k of [i, i + 1]) {
          const s = document.createElement("span");
          s.textContent = plies[k] ?? (k === 0 ? "…" : "");
          if (k === plies.length - 1) s.className = "latest";
          li.appendChild(s);
        }
        list.appendChild(li);
      }
      list.scrollTop = list.scrollHeight;
    }
    $("newGame").className = state.over ? "primary" : "";
    $("replayBtn").textContent = replay ? "Stop replay" : "Replay game";
    $("replayBtn").disabled = !replay && !state.moves.length;
    $("promo").classList.toggle("open", !!pendingPromo);
  }

  function hintText() {
    if (replay) {
      const f = replay.frames[replay.i];
      return `Move ${f.ply} of ${replay.frames.length - 1}. Press Escape to stop.`;
    }
    if (flash) return flash;
    if (state.over) return state.result === "1/2-1/2" ? "Result ½–½." : `Result ${state.result}.`;
    if (!myTurn()) return `Waiting for ${cap(state.turn)} to move.`;
    if (pendingPromo) return "Choose a piece, or press Escape.";
    if (selected) {
      const n = movesFrom(selected).length;
      return n ? `Pick a square for the ${describePiece(pieceAt(selected))}.` : "That piece has no legal move.";
    }
    return "Your move. Pick a piece.";
  }

  function say(text) {
    flash = text;
    lastAnnounced = "";
    announce(text);
  }

  function announce(text) {
    if (!text || text === lastAnnounced) return;
    lastAnnounced = text;
    $("live").textContent = text;
  }

  function showNotice(text) {
    const n = $("notice");
    n.textContent = "";
    if (!text) return;
    const el = document.createElement("wm-notice");
    el.setAttribute("tone", "red");
    el.textContent = text + " ";
    const close = document.createElement("button");
    close.type = "button";
    close.textContent = "Dismiss";
    close.onclick = () => showNotice("");
    el.appendChild(close);
    n.appendChild(el);
  }

  function choose(sq) {
    if (!state) return;
    // A click on the board means "back to the game".
    if (replay) return stopReplay(false);
    focusSq = sq;
    flash = "";
    if (pendingPromo) return;
    const p = pieceAt(sq);
    if (selected) {
      const options = movesFrom(selected).filter((m) => m.uci.slice(2, 4) === sq);
      if (options.length > 1) {
        pendingPromo = { from: selected, to: sq };
        render();
        openPromo(options);
        return;
      }
      if (options.length === 1) {
        play(options[0].uci);
        return;
      }
    }
    if (p && colorOf(p) === seatColor()) {
      if (!myTurn()) {
        selected = null;
        if (state.over) say("The game is over. Start a new game to play again.");
        else say(`It is ${cap(state.turn)}'s turn. This board plays ${seatSide()}.`);
        render();
        return;
      }
      selected = selected === sq ? null : sq;
      render();
      return;
    }
    if (state.over) {
      say("The game is over. Start a new game to play again.");
    } else if (selected && myTurn()) {
      say(`Not a legal move: the ${describePiece(pieceAt(selected))} on ${selected} cannot go to ${sq}.`);
    } else if (p) {
      say(`That is a ${describePiece(p)}. This board plays ${seatSide()}.`);
    }
    selected = null;
    render();
  }

  function openPromo(options) {
    const row = $("promoRow");
    row.textContent = "";
    for (const k of ["q", "r", "b", "n"]) {
      const m = options.find((o) => o.uci.endsWith(k));
      if (!m) continue;
      const b = document.createElement("button");
      b.type = "button";
      const g = document.createElement("span");
      g.className = "glyph";
      g.textContent = GLYPH[k] + "︎";
      g.setAttribute("aria-hidden", "true");
      b.appendChild(g);
      b.appendChild(document.createTextNode(NAME[k][0].toUpperCase() + NAME[k].slice(1)));
      b.onclick = () => play(m.uci);
      row.appendChild(b);
    }
    $("hint").textContent = hintText();
    row.querySelector("button")?.focus();
  }

  function play(uci) {
    selected = null;
    pendingPromo = null;
    showNotice("");
    wm.post({ type: "move", move: uci, side: seatSide() });
    render();
  }

  function cancel() {
    selected = null;
    pendingPromo = null;
    render();
    boardEl.querySelector(`[data-sq="${focusSq}"]`)?.focus();
  }

  boardEl.addEventListener("click", (e) => {
    const b = e.target.closest(".sq");
    if (!b) return;
    choose(b.dataset.sq);
    // Keep the keyboard where the click was, so arrows and Enter carry on from
    // here: macOS does not focus a clicked button by itself.
    if (!pendingPromo) boardEl.querySelector(`[data-sq="${b.dataset.sq}"]`)?.focus();
  });

  boardEl.addEventListener("keydown", (e) => {
    const b = e.target.closest(".sq");
    if (!b) return;
    const order = drawOrder();
    const i = order.indexOf(b.dataset.sq);
    const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -8, ArrowDown: 8 };
    if (e.key in moves) {
      e.preventDefault();
      const col = i % 8;
      if ((e.key === "ArrowLeft" && col === 0) || (e.key === "ArrowRight" && col === 7)) return;
      const j = i + moves[e.key];
      if (j < 0 || j > 63) return;
      focusSq = order[j];
      for (const el of boardEl.querySelectorAll(".sq")) el.tabIndex = el.dataset.sq === focusSq ? 0 : -1;
      boardEl.querySelector(`[data-sq="${focusSq}"]`).focus();
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      choose(b.dataset.sq);
    } else if (e.key === "Escape") {
      e.preventDefault();
      cancel();
    }
  });

  // Escape lets go of a picked piece wherever focus is: a clicked square
  // keeps no focus in some engines, so the board's own handler may not hear it.
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || e.defaultPrevented) return;
    if (replay) {
      e.preventDefault();
      stopReplay(false);
    } else if (pendingPromo || selected) {
      e.preventDefault();
      cancel();
    } else if (!$("panel").hidden && matchMedia("(max-width: 640px)").matches) {
      setPanel(false);
      $("panelToggle").focus();
    }
  });

  $("replayBtn").onclick = () => {
    if (replay) stopReplay(false);
    else wm.post({ type: "replay" });
  };

  $("newGame").onclick = () => {
    newSide = state?.host || "white";
    syncSeg();
    $("confirm").classList.add("open");
    $("mainActions").style.display = "none";
    $("startNew").focus();
  };
  $("cancelNew").onclick = () => {
    $("confirm").classList.remove("open");
    $("mainActions").style.display = "";
  };
  $("startNew").onclick = async () => {
    $("confirm").classList.remove("open");
    $("mainActions").style.display = "";
    selected = null;
    pendingPromo = null;
    showNotice("");
    try {
      await wm.call("newGame", { hostSide: newSide });
    } catch (e) {
      showNotice(e?.message || String(e));
    }
  };
  function syncSeg() {
    for (const b of $("seg").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.side === newSide));
  }
  $("seg").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    newSide = b.dataset.side;
    syncSeg();
  });

  wm.onMessage((msg) => {
    if (msg.type === "replay") return startReplay(msg.frames, msg.delayMs);
    if (msg.type === "replayStop") return stopReplay(false);
    if (msg.type === "state" || msg.type === "refused") {
      const prevKey = state ? state.fen + state.moves.length : null;
      state = msg.state;
      const changed = prevKey !== state.fen + state.moves.length;
      if (changed) {
        flash = "";
        if (msg.type === "state") $("moveInput").value = "";
        selected = null;
        pendingPromo = null;
        if (msg.type === "state") showNotice("");
        // Keep the keyboard on the board where the host's eye is.
        if (!pieceAt(focusSq) && state.lastMove) focusSq = state.lastMove.uci.slice(2, 4);
      }
      if (msg.type === "refused") showNotice(msg.message);
      if (state.restoreNote && !noteShown) {
        noteShown = true;
        showNotice(state.restoreNote);
      }
      render();
      const lm = state.lastMove;
      announce(lm ? `${lm.side === "white" ? "White" : "Black"} played ${lm.san}. ${state.sentence}` : state.sentence);
    }
  });

  $("moveForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("moveInput").value.trim();
    if (!text || !state) return;
    if (replay) stopReplay(false);
    selected = null;
    pendingPromo = null;
    showNotice("");
    // The isolate checks it: a wrong side, an illegal move or a typo comes back refused.
    wm.post({ type: "move", move: text, side: seatSide() });
  });
  $("seat").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || !state) return;
    seat = b.dataset.side === state.host ? null : b.dataset.side;
    selected = null;
    flash = "";
    render();
  });

  function setPanel(open) {
    $("panel").hidden = !open;
    const t = $("panelToggle");
    t.setAttribute("aria-expanded", String(open));
    t.setAttribute("aria-label", open ? "Hide panel" : "Show panel");
    t.title = open ? "Hide panel" : "Show panel";
    try { localStorage.setItem("chess.panel", open ? "open" : "closed"); } catch {}
  }
  $("panelToggle").onclick = () => setPanel($("panel").hidden);
  $("hidePanel").onclick = () => {
    setPanel(false);
    $("panelToggle").focus();
  };
  try { setPanel(localStorage.getItem("chess.panel") === "open"); } catch { setPanel(false); }

  wm.post({ type: "__ui_ready" });
</script>
